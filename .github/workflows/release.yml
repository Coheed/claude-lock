name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        shell: powershell
        run: .\windows\test\Run-Tests.ps1
      - name: Build archive
        shell: powershell
        run: |
          $name = "claude-lock-windows-${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item windows\claude-secure.ps1, windows\ClaudeLock.Common.ps1, windows\setup-claude-lock.ps1, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii SHA256SUMS
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" claude-lock-windows-*.zip SHA256SUMS --generate-notes
