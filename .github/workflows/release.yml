name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tests
        shell: powershell
        run: .\windows\test\Run-Tests.ps1
      - name: Build archive
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "claude-lock-windows-$env:TAG"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item windows\claude-secure.ps1, windows\ClaudeLock.Common.ps1, windows\setup-claude-lock.ps1, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii SHA256SUMS
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" claude-lock-windows-*.zip SHA256SUMS --generate-notes --repo "$GITHUB_REPOSITORY"
